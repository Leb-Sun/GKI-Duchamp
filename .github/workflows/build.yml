name: GKI-Duchamp Builder

on:
  workflow_call:
    inputs:
      TODO:
        type: string
      KSU:
        type: string
      KSU_SUSFS:
        type: string
      STATUS:
        type: string
      TEST:
        type: string
      LTO:
        type: string

  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      STATUS:
        description: Run type
        default: "RELEASE"
        type: choice
        options:
          - "RELEASE"
          - "BETA"

      TEST:
        description: debug the pipeline
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: enable LTO optimization
        default: "thinLTO"
        type: choice
        options:
          - "noneLTO"
          - "thinLTO"
          - "fullLTO"

      CLEAN_LTO_CACHE:
        description: "Clean ThinLTO cache to fix .config bug"
        type: boolean
        default: false

# This fork releases to its own repo (see GKI_RELEASES_REPO in build.sh), so the
# job token needs write access to contents. Upstream releases to itself and gets
# it implicitly.
permissions:
  contents: write

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # This fork ships a single KernelSU-Next (non-SUSFS) variant.
          # SuSFS is intentionally not built: it is incompatible with
          # droidspaces at runtime. Other managers are not maintained here.
          echo 'matrix={"include":[{"name":"KSUN","KSU":"KSUN","KSU_COMPAT":"false","KSU_SUSFS":"false"}]}' >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Inputs and Secrets
        env:
          KSU: ${{ matrix.KSU }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          KERNEL_REPO: ${{ secrets.KERNEL_REPO }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }

          ret=0

          if [[ $KSU == "no" && $KSU_SUSFS == "true" ]]; then
              _error "Cannot use SuSFS without KernelSU"
          fi

          if [[ $ret -gt 0 ]]; then
            exit $ret
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio
          pip install lxml

      - name: Cache ccache + LTO
        uses: actions/cache@v6
        id: ccache-cache
        with:
          path: |
            ~/.ccache
            /dev/shm/thinlto-cache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_REPO: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          TODO: ${{ inputs.TODO }}
          STATUS: ${{ inputs.STATUS }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          # Always on for this fork — droidspaces is one of the two reasons it
          # exists, so it isn't a dispatch-time choice you can forget to tick.
          DROIDSPACES: "true"
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: build-env-${{ matrix.name }}.txt
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          path: |
            downloaded-artifacts/artifacts/*.txt
            downloaded-artifacts/artifacts/*.zip

  release:
    needs: build
    if: github.event.inputs.TODO != 'defconfig' && github.event.inputs.STATUS == 'RELEASE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds
        run: |
          # Find all environment files
          ENV_FILES=$(find release-artifacts -name "build-env-*.txt")

          # Set defaults
          echo "KSU=Not included" >> $GITHUB_ENV
          echo "KSU_SUSFS=Not included" >> $GITHUB_ENV
          echo "SUSFS_VERSION=Not included" >> $GITHUB_ENV

          # Load values from any file
          SUSFS_FILE=""
          for env_file in $ENV_FILES; do
            echo "Checking $env_file..."

            # Check if this file has SUSFS
            if grep -q "SUSFS_VERSION=" "$env_file" && grep -q "KSU_SUSFS=true" "$env_file"; then
              SUSFS_FILE="$env_file"
              echo "Found SUSFS build: $env_file"
              break
            fi
          done

          # If no SUSFS file, take first file
          if [ -z "$SUSFS_FILE" ]; then
            SUSFS_FILE=$(echo "$ENV_FILES" | head -1)
          fi

          # Load the chosen file
          if [ -f "$SUSFS_FILE" ]; then
            echo "Loading environment from: $SUSFS_FILE"
            while IFS='=' read -r key value; do
              if [ -n "$key" ] && [ -n "$value" ]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < "$SUSFS_FILE"
          fi

      - name: Prepare release body
        run: |
            # Get list of built variants
            VARIANTS=$(ls release-artifacts/*.zip 2>/dev/null | grep -v 'ntsync-policy' | xargs -n1 basename | sed 's/.zip//')

            {
            if [ "${{ inputs.TEST }}" = "yes"  ];then
              echo ">[!warning]"
              echo ">This is an empty testing release — please do not download or install!"
              echo ""
            fi
            cat << EOF
            ### 📢 ${{ env.RELEASE_NAME }}

            **Build Information:**
            - 🐧 **Kernel:** ${{ env.RELEASE_NAME }}
            - 🔥 **LTO optimizations:** ${{ inputs.LTO }}
            - 🐳 **DroidSpaces:** Enabled
            - 🔖 **Version:** ${{ env.LINUX_VERSION }} (android14-6.1-lts)
            - 📦 **Variants:**
            $(echo "$VARIANTS" | sed 's/^/  - /')
            - 🛡️ **SuSFS:** ඞ ${{ env.SUSFS_VERSION }}
            - ⚙️ **Compiler:** ${{ env.COMPILER_STRING }}

            >[!Important]
            >- **Bootloop?** Flash a **Compat** variant first.
            >- **Issues?** Check [Discussions](https://github.com/ahmed-alnassif/GKI-Duchamp/discussions) before opening an issue.

            ---

            ### 💬 Community & Support
            - **Have questions?** Start a [Discussion](https://github.com/ahmed-alnassif/GKI-Duchamp/discussions)
            - **Found a bug?** Open an [Issue](https://github.com/ahmed-alnassif/GKI-Duchamp/issues) with logs
            - **Enjoying the kernel?** ⭐ Star the [repo](https://github.com/ahmed-alnassif/GKI-Duchamp)!

            ---

            **⚡ Performance & Battery Optimizations**
            Engineered for smoother UI, better multitasking & gaming on Poco X6 Pro:

            **⚡ Performance**
            - **300Hz timer** → lower input lag, snappier feel
            - **MGLRU** → better multitasking & battery life
            - **Faster memory ops** → up to 50% faster string/memory handling
            - **mq-deadline I/O** → low-latency on UFS 4.0 storage
            - **CPU governors:** schedutil + ondemand → efficient & responsive
            - **NTSync driver** → faster Windows games/apps on Winlator/GameHub

            **🌐 Network**
            - **TCP BBRv3 + Westwood+** → better WiFi/mobile data speeds
            - **TCP_NODELAY forced** → reduced latency
            - **IPv6 NAT + IP Set** → better tethering & VPN

            **🔋 Battery Life**
            - **Wakelock cap:** 500ms → prevents battery drain
            - **Freeze timeout:** 20s → 1s → faster deadlock detection
            - **ext4 commit age:** 30s → fewer disk writes
            - **Minimized alarm wakeups** → less standby drain

            **💾 Storage & Filesystem**
            - **F2FS tuning:** reduced GC sleep (50ms) → smoother I/O
            - **ext4 optimization** → extended commit age

            **🛡️ Security**
            - **Baseband Guard (BBG)** → blocks unauthorized writes to critical partitions

            ---

            ### 📱 Recommended Companion Modules
            Enhance your Poco X6 Pro with these modules designed for GKID kernels:

            | Module | Description | ROM |
            |--------|-------------|-----|
            | [**GPU Unlocker**](https://github.com/ahmed-alnassif/GPU-Unlocker) | Unlock Mali-G615 MC6 from **701MHz → 1.4GHz** (100% boost) | HyperOS |
            | [**Thermal Manager**](https://github.com/ahmed-alnassif/Thermal-Manager) | Fix thermal mode reset. Force-persist Balanced ⚖️, Battery Saver 🔋, Performance ⚡, or Gaming 🎮. Includes WebUI. | AOSP |
            | [**DSP AudioFix**](https://github.com/ahmed-alnassif/DSP-AudioFix) | Fix distorted audio on devices with Awinic smart amps | AOSP |

            > [!Tip]
            > **HyperOS users:** GPU Unlocker gives you a massive gaming performance boost.
            > **AOSP users:** Thermal Manager fixes a stock bug that resets your thermal mode.

            ---

            >[!Tip]
            >This kernel includes **TCP BBRv3** (default) and **Westwood+** congestion control algorithms.
            >You can switch between them - **changes are temporary and reset after reboot.**

            **Switch to Westwood+ (better for some networks):**
            \`\`\`bash
            su -c "sysctl -w net.ipv4.tcp_congestion_control=westwood"
            \`\`\`

            **Restore BBRv3 (default):**
            \`\`\`bash
            su -c "sysctl -w net.ipv4.tcp_congestion_control=bbr"
            \`\`\`

            Test both and choose the one that performs better on your network.
            > **Note:** To make the change permanent, create a script in `/data/adb/service.d/` with the sysctl command.

            ---
            **Android14-6.1-LTS Kernel Changelog (last 10 commits):**
            EOF
            echo ""
            if [ -f release-artifacts/android_kernel-6.1_changelog.txt ]; then
              cat release-artifacts/android_kernel-6.1_changelog.txt
            else
              echo "*No changelog available*"
            fi
            echo ""
            echo "**Full Commit History:** [Browse all commits](https://github.com/ahmed-alnassif/GKI-Duchamp-6.1/commits/GKID-6.1)"
            echo ""
            echo "---"
            echo "**KernelSU Next Changelog (last 10 commits):**"
            echo ""
            if [ -f release-artifacts/ksun_changelog.txt ]; then
              cat release-artifacts/ksun_changelog.txt
            else
              echo "*No changelog available*"
            fi
            echo ""
            echo "**Full Commit History:** [Browse all commits](https://github.com/pershoot/KernelSU-Next/commits/dev-susfs)"
            echo ""
            echo "---"
            echo "**Checksums:**"
            echo '```'
            cat release-artifacts/checksums.txt
            echo '```'
            } > release_body.md

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          prerelease: true
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md
